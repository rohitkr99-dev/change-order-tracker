<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<meta name="description" content="Log change orders and RAID items on site, offline, and get a one-page project status report.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Change Order Tracker</title>
</head>
<body>
<header class="appbar"><h1 id="title">Change Order Tracker</h1></header>
<div id="banner" role="alert" hidden></div>
<main id="view" tabindex="-1"></main>
<nav class="tabs" aria-label="Sections">
  <button data-act="tab" data-tab="status">Report</button>
  <button data-act="tab" data-tab="changes">Changes</button>
  <button data-act="tab" data-tab="raid">RAID</button>
  <button data-act="tab" data-tab="settings">Settings</button>
</nav>
<dialog id="dlg"></dialog>
<script src="app.js"></script>
</body>
</html>
